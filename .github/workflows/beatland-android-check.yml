name: Beatland Android build check

# Builds the `beatlandDebug` APK on GitHub so the Android side can be checked without compiling on a PC (D-046).
# The Windows installer workflow only compiles the desktop target; this one compiles Android, including the
# `checkBeatlandDebugDuplicateClasses` step that the desktop build does not have.
#
# Start it by pushing a tag named `beatland-android-check-<n>` (Draft a new release in the GitHub web, Target = the branch
# to check) or by hand from the Actions tab. The APK is attached to the run as an artifact ("Beatland-debug-apk-full-false" / "-true").

on:
  push:
    tags:
      - 'beatland-android-check-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    # Both values of isFullBuild: BUILD.md recommends false (D-016) but gradle.properties defaults to true, so a build
    # started from Android Studio with the default would not be covered otherwise.
    name: Build beatlandDebug (isFullBuild=${{ matrix.full }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        full: ['false', 'true']

    steps:
      - name: Checkout (with the core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          cache: gradle

      - name: Accept the Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Same two helpers as the Windows workflow (D-042): Gradle is fetched with retries, and Gradle's own failure text is
      # republished as an annotation that can be read through the GitHub API.
      - name: Fetch the Gradle distribution (with retries)
        run: bash scripts/beatland/prefetch-gradle.sh

      - name: Licenses list for the About screen
        run: bash scripts/beatland/ci-gradle.sh exportLibraryDefinitions -PisFullBuild=${{ matrix.full }} --no-configuration-cache

      - name: Build the debug APK
        run: bash scripts/beatland/ci-gradle.sh :androidApp:assembleBeatlandDebug -PisFullBuild=${{ matrix.full }} --no-configuration-cache

      - name: List the APK
        run: find androidApp/build/outputs/apk -name '*.apk' -exec ls -la {} \;

      - name: Upload the APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Beatland-debug-apk-full-${{ matrix.full }}
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
