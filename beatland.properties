# Beatland fork - brand configuration (single source of truth for the app's DISPLAY name).
#
# Change brand.name here, then run:   python3 scripts/beatland/apply_brand.py
# The script regenerates every derived file (Brand.kt, Android app_name.xml, strings.xml names,
# conveyor.conf display lines). Gradle reads this file directly for the desktop packaging name.
# Internal identifiers (package names, applicationId, url schemes, .simpmusic data dir) are NOT
# affected on purpose. See docs/beatland/BRANDING.md.
brand.name=Beatland
